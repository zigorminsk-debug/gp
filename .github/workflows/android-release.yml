name: Android release APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish this signed build as a GitHub Release for in-app updates
        required: true
        type: boolean
        default: false

permissions:
  contents: write

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  build:
    name: Build and sign Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6.1.0

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '8.9'

      - name: Configure the runner's preinstalled Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" || { echo "GitHub runner Android SDK was not found"; exit 1; }
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager was not found under $SDK_ROOT"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          dirname "$SDKMANAGER" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK (CI validation)
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/gradle-build.log"
          if gradle --no-daemon --stacktrace assembleDebug >"$LOG" 2>&1; then
            cat "$LOG"
          else
            cat "$LOG"
            {
              echo '### Gradle build failure details'
              echo '```text'
              tail -n 80 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              echo "::error title=Gradle build diagnostics::$line"
            done < <(grep -E '(^e: |error:|What went wrong|Execution failed for task|Could not resolve|No matching|FAILURE:|BUILD FAILED|^> |^Caused by:|^java\\.|^[[:space:]]+at |^\\* Exception|^\\* Try:)' "$LOG" | tail -n 50)
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gp-guide-${{ env.VERSION_NAME }}-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Verify signing secrets are configured
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS repository secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD repository secret"; exit 1; }

      - name: Restore signing keystore from Actions secret
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Name the signed APK
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        run: cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/gp-guide-${VERSION_NAME}.apk"

      - name: Upload signed APK artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        uses: actions/upload-artifact@v4
        with:
          name: gp-guide-${{ env.VERSION_NAME }}-signed
          path: ${{ runner.temp }}/gp-guide-${{ env.VERSION_NAME }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release for in-app updater
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VERSION_NAME}"
          apk="$RUNNER_TEMP/gp-guide-${VERSION_NAME}.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" \
              --title "GP Guide ${VERSION_NAME}" \
              --notes "Подписанный APK. versionCode=${VERSION_CODE}. Обновление устанавливается из приложения через системный установщик Android."
          fi
