name: Android and Windows releases

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish signed Android APK and Windows setup to GitHub Releases (requires signing secrets)
        required: true
        type: boolean
        default: false

permissions:
  contents: write

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  build-android:
    name: Build Android app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6.1.0

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '8.9'

      - name: Configure the runner's preinstalled Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" || { echo "GitHub runner Android SDK was not found"; exit 1; }
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager was not found under $SDK_ROOT"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          dirname "$SDKMANAGER" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK (CI validation)
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/gradle-build.log"
          if gradle --no-daemon --stacktrace -PappVersionCode="$VERSION_CODE" -PappVersionName="$VERSION_NAME" assembleDebug >"$LOG" 2>&1; then
            cat "$LOG"
          else
            cat "$LOG"
            {
              echo '### Gradle build failure details'
              echo '```text'
              tail -n 80 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              echo "::error title=Gradle build diagnostics::$line"
            done < <(grep -E '(^e: |error:|What went wrong|Execution failed for task|Could not resolve|No matching|FAILURE:|BUILD FAILED|^> |^Caused by:|^java\\.|^[[:space:]]+at |^\\* Exception|^\\* Try:)' "$LOG" | tail -n 50)
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gp-guide-${{ env.VERSION_NAME }}-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Verify Android signing secrets for a release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS repository secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD repository secret"; exit 1; }

      - name: Restore signing keystore from Actions secret
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build signed Android release APK
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace -PappVersionCode="$VERSION_CODE" -PappVersionName="$VERSION_NAME" assembleRelease

      - name: Name Android APK for release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        run: cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/gp-guide-${VERSION_NAME}.apk"

      - name: Upload signed Android APK artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gp-guide-${{ env.VERSION_NAME }}-android-signed
          path: ${{ runner.temp }}/gp-guide-${{ env.VERSION_NAME }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Android APK GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VERSION_NAME}"
          apk="$RUNNER_TEMP/gp-guide-${VERSION_NAME}.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" \
              --title "GP Guide ${VERSION_NAME}" \
              --notes "Сборки Android и Windows. versionCode=${VERSION_CODE}. APK и Windows setup публикуются из одного запуска Actions."
          fi

  build-windows:
    name: Build Windows GUI and setup.exe
    runs-on: windows-latest
    needs: build-android
    steps:
      - name: Check out source
        uses: actions/checkout@v6.1.0

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.x'
          cache: false

      - name: Set up GCC for Wails WebView2 bindings
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: UCRT64
          cache: false
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set Windows installer version
        working-directory: windows
        shell: pwsh
        run: |
          $config = Get-Content wails.json -Raw | ConvertFrom-Json
          $config.info.productVersion = $env:VERSION_NAME
          $config | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8

      - name: Resolve Go dependencies
        working-directory: windows
        run: go mod tidy

      - name: Build Windows GUI and NSIS installer
        working-directory: windows
        shell: pwsh
        run: |
          wails build -platform windows/amd64 -nsis -clean `
            -ldflags "-X main.versionName=$env:VERSION_NAME -X main.versionCode=$env:VERSION_CODE"

      - name: Prepare Windows setup and SHA-256 checksum
        working-directory: windows
        shell: pwsh
        run: |
          try {
            $installer = Get-ChildItem -Path build/bin -File -Recurse | Where-Object { $_.Name -match 'installer\.exe$' } | Select-Object -First 1
            if (-not $installer) {
              $files = (Get-ChildItem -Path build -File -Recurse | ForEach-Object FullName) -join '; '
              throw "Wails NSIS setup.exe was not produced. Files: $files"
            }
            $name = "gp-guide-$env:VERSION_NAME-windows-setup.exe"
            $path = Join-Path $env:RUNNER_TEMP $name
            Copy-Item -LiteralPath $installer.FullName -Destination $path -Force
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            [System.IO.File]::WriteAllText("$path.sha256", "$hash  $name", [System.Text.Encoding]::ASCII)
          } catch {
            $message = $_.Exception.Message -replace '[\r\n]+', ' '
            Write-Output "::error title=Windows setup packaging::$message"
            exit 1
          }

      - name: Upload Windows setup artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gp-guide-${{ env.VERSION_NAME }}-windows-setup
          path: |
            ${{ runner.temp }}/gp-guide-${{ env.VERSION_NAME }}-windows-setup.exe
            ${{ runner.temp }}/gp-guide-${{ env.VERSION_NAME }}-windows-setup.exe.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Add Windows setup to GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v$env:VERSION_NAME"
          gh release upload $tag `
            "$env:RUNNER_TEMP\gp-guide-$env:VERSION_NAME-windows-setup.exe" `
            "$env:RUNNER_TEMP\gp-guide-$env:VERSION_NAME-windows-setup.exe.sha256" `
            --clobber
