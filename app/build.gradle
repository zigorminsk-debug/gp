plugins {
    id 'com.android.application'
}

def appVersionCode = providers.gradleProperty('appVersionCode').getOrElse('1').toInteger()
def appVersionName = providers.gradleProperty('appVersionName').getOrElse('1.0.1')

android {
    namespace 'by.gpguide.android'
    compileSdk 35

    defaultConfig {
        applicationId 'by.gpguide.android'
        minSdk 23
        targetSdk 35
        versionCode = appVersionCode
        versionName = appVersionName
    }

    signingConfigs {
        release {
            def storePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
